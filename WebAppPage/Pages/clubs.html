<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدخل | أخبار الأندية</title>
    
    <link rel="stylesheet" href="../style.css"> 
    <link rel="stylesheet" href="clubs.css"> 
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body>

    <div id="sidebarOverlay"></div>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h3 style="font-family: 'Tajawal'; font-weight:800; color:var(--primary-text);">القائمة</h3>
            <button class="close-btn">✕</button>
        </div>

        <ul class="modern-sidebar">
            <li class="menu-label">التصفح</li>
            <li><a href="../index.html"><i class="fi fi-rr-home"></i> الرئيسية</a></li>
            <li><a href="center.html" class="active"><i class="fi fi-rr-dashboard"></i> الواجهة</a></li>
            <li><a href="../Tools.html"><i class="fi fi-rr-apps"></i> الأدوات</a></li>
            <li><a href="../plans.html"><i class="fi fi-rr-graduation-cap"></i> التخصصات</a></li>

            <li class="menu-label">المجتمع</li>
            <li><a href="../missing.html"><i class="fi fi-rr-box"></i> مبادرة مفقود</a></li>
            <li><a href="https://x.com/i/communities/1823043306739110132" target="_blank"><i class="fi fi-brands-twitter"></i> مجتمع JIC (X)</a></li>
            <li><a href="https://t.me/newsjuc" target="_blank"><i class="fi fi-rr-paper-plane"></i> قناة الأخبار</a></li>

            <li class="menu-divider"></li>

            <li class="theme-toggle-card">
                <div class="theme-switch-wrapper">
                    <span class="theme-label">
                        <i class="fi fi-rr-moon"></i> الوضع الليلي
                    </span>
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" id="checkbox" />
                        <div class="slider round"></div>
                    </label>
                </div>
            </li>
        </ul>
        
        <div style="margin-top: auto; padding-bottom: 20px; font-size: 11px; color: var(--text-light); text-align: center;">
            منصة مدخل © 2026
        </div>
    </aside>

    <header class="hub-header">
        <div class="header-right">
            <img src="../logo.webp" alt="شعار" class="hub-logo">
            <h1 class="hub-title">اخبار الاندية</h1>
        </div>

        <div class="header-left">
            <button class="icon-btn" onclick="toggleNotif()">
                <i class="fi fi-rr-bell"></i>
                <span class="notif-dot"></span> 
            </button>
            
            <div class="menu-btn icon-btn">
                <i class="fi fi-rr-menu-burger"></i>
            </div>
        </div>
    </header>

<div class="notif-panel" id="notifPanel">
        <div class="notif-header">
            <h3>الإشعارات</h3>
            <button class="mark-read-btn" onclick="markAllRead()">تحديد كـ مقروء</button>
        </div>
    </div>

    <main class="clubs-main">
        
        <section class="search-section">
            <div class="modern-search">
                <i class="fi fi-rr-search"></i>
                <input type="text" id="clubSearch" placeholder="ابحث عن خبر، أو فعالية...">
            </div>
        </section>

        <section class="filters-section">
            <div class="filters-container">
                <button class="filter-btn active" data-filter="all">
                    <div class="filter-icon"><i class="fi fi-rr-apps"></i></div>
                    <span>الكل</span>
                </button>
                <button class="filter-btn" data-filter="CS">
                    <img src="clubs-icon/CS.webp" alt="نادي الحاسب" class="club-filter-img">
                    <span>نادي الحاسب</span>
                </button>
                <button class="filter-btn" data-filter="EEC">
                    <img src="clubs-icon/EEC.webp" alt="النادي" class="club-filter-img">
                    <span>نادي الهندسة الكهربائية</span>
                </button>
                <button class="filter-btn" data-filter="Sustain">
                    <img src="clubs-icon/sustain.webp" alt="النادي" class="club-filter-img">
                    <span>نادي الاستدامة</span>
                </button>

                <button class="filter-btn" data-filter="JIC">
                    <img src="clubs-icon/JIC.webp" alt="النادي" class="club-filter-img">
                    <span>المجلس الطلابي</span>
                </button>
                
                <button class="filter-btn" data-filter="BUS">
                    <img src="clubs-icon/culture.webp" alt="النادي" class="club-filter-img">
                    <span>اخرى</span>
                </button>
            </div>
        </section>

        <section class="news-grid" id="newsGrid"> </section>

    </main>

    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item"> <i class="fi fi-rr-home"></i> 
            <span>الرئيسية</span>
        </a>
        <a href="../Tools.html" class="nav-item"> <i class="fi fi-rr-apps"></i>
            <span>الأدوات</span>
        </a>
        <a href="center.html" class="nav-item active"> <i class="fi fi-rr-dashboard"></i>
            <span>الواجهة</span>
        </a>
        <a href="../library.html" class="nav-item"> <i class="fi fi-rr-book-alt"></i>
            <span>المكتبة</span>
        </a>
        <a href="clubs.html" class="nav-item"> <i class="fi fi-rr-newspaper"></i>
            <span>الأخبار</span>
        </a>
    </nav>

    <script src="../script.js"></script>
    <script src="../notifications.js"></script>
    <script src="clubs.js"></script>
</body>

</html>
