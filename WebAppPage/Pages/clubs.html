    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدخل | أخبار الأندية</title>
    
    <link rel="stylesheet" href="../style.css"> 
    <link rel="stylesheet" href="clubs.css"> 
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>

<body>

   <app-header title="أخبار الأندية" base-path="../"></app-header>

<div class="notif-panel" id="notifPanel">
        <div class="notif-header">
            <h3>الإشعارات</h3>
            <button class="mark-read-btn" onclick="markAllRead()">تحديد كـ مقروء</button>
        </div>
    </div>

        
       <main class="clubs-main">
        
        <!-- شريط التبويبات (الأندية / الأخبار) -->
        <div class="clubs-tabs-wrapper">
            <div class="modern-tabs">
                <button class="club-tab-btn active" data-target="clubsListTab">الأندية الطلابية</button>
                <button class="club-tab-btn" data-target="newsFeedTab">أخبار الأندية</button>
            </div>
        </div>

        <!-- التبويب الأول: قائمة الأندية الطلابية -->
        <section id="clubsListTab" class="tab-content active">
            <div class="horizontal-clubs-list" id="clubsListContainer">
                <!-- سيتم توليد الأندية هنا برمجياً -->
            </div>
        </section>

        <!-- التبويب الثاني: أخبار الأندية (نفس تصميمك السابق) -->
        <section id="newsFeedTab" class="tab-content">
            <section class="search-section">
                <div class="modern-search">
                    <i class="fi fi-rr-search"></i>
                    <input type="text" id="clubSearch" placeholder="ابحث عن خبر، أو فعالية...">
                </div>
            </section>
            <section class="news-grid" id="newsGrid"></section>
        </section>

    </main>


<nav class="bottom-nav">

    </a>
