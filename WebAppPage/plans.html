    <script>
        window.JIC_Bachelor_List = [];
        window.JIC_Diploma_List = [];
        window.JTI_Diploma_List = [];
        let currentLoadingTarget = null;

        // الكلاس العام الذي سيستقبل البيانات
        class Majors {
            constructor(enName, arName, oldIcon, degree, years, imagePath, gender, courses) {
                this.id = enName.replace(/\s+/g, '_');
                this.name = arName;
                this.arabicName = arName;
                this.degree = degree;
                this.years = years;
                this.genders = gender;
                this.courses = courses;
                
                this.icon = "fi-rr-document"; 
                const lowerName = enName.toLowerCase();
                if(lowerName.includes("instrumentation")) this.icon = "fi-rr-dashboard";
                else if(lowerName.includes("chemical")) this.icon = "fi-rr-test-tube";
                else if(lowerName.includes("electrical")) this.icon = "fi-rr-bulb";
                else if(lowerName.includes("mechanical") || lowerName.includes("manufacturing")) this.icon = "fi-rr-settings";
                else if(lowerName.includes("computer") || lowerName.includes("information") || lowerName.includes("software")) this.icon = "fi-rr-laptop";
                else if(lowerName.includes("business") || lowerName.includes("marketing") || lowerName.includes("accounting")) this.icon = "fi-rr-chart-histogram";
                else if(lowerName.includes("ndt")) this.icon = "fi-rr-search-alt";
                else if(lowerName.includes("polymer")) this.icon = "fi-rr-flask";

                if (currentLoadingTarget === 'JIC_BACH') window.JIC_Bachelor_List.push(this);
                else if (currentLoadingTarget === 'JIC_DIP') window.JIC_Diploma_List.push(this);
                else if (currentLoadingTarget === 'JTI') window.JTI_Diploma_List.push(this);
            }
        }

        async function loadScriptSmart(url, targetList) {
            try {
                currentLoadingTarget = targetList;
                const response = await fetch(url);
                if (!response.ok) throw new Error("File not found");
                
                let code = await response.text();

                // ✅ الحل الجذري: توليد اسم عشوائي للكلاس لكل ملف عشان ما يتصادمون
                const uniqueClassName = "Ignored_Majors_" + Math.random().toString(36).substr(2, 9);
                
                // استبدال تعريف الكلاس بالاسم العشوائي الجديد
                code = code.replace(/class\s+Majors/g, `class ${uniqueClassName}`);

                const scriptEl = document.createElement('script');
                scriptEl.textContent = code;
                document.body.appendChild(scriptEl);
                
                console.log(`✅ تم تحميل ${url} بنجاح`);
            } catch (error) {
                console.error(`❌ فشل تحميل ${url}:`, error);
                // محاولة إظهار رسالة خطأ للمستخدم داخل الشبكة
                const grid = document.getElementById('majors-grid');
                if(grid) grid.innerHTML += `<p style="color:red; font-size:12px;">فشل تحميل: ${url.split('/').pop()}</p>`;
            }
        }

        async function initAllMajors() {
            // تأكد من صحة المسارات هنا بناءً على بنية ملفاتك
            await loadScriptSmart('../JICPage/bacholarMajors/bacholar.js', 'JIC_BACH');
            await loadScriptSmart('../JICPage/deplomeMajors/deplomes.js', 'JIC_DIP');
            await loadScriptSmart('../JTIPage/JTImajors/JTImajors.js', 'JTI');

            const engineScript = document.createElement('script');
            engineScript.src = "plans.js";
            document.body.appendChild(engineScript);
        }

        initAllMajors();
    </script>
