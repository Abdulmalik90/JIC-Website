<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدخل | التخصصات والخطط</title>
    
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="plans.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body>

    <div id="emoji-background"></div>

    <!-- الهيدر العصري الموحد -->
    <app-header title="التخصصات" base-path="../"></app-header>
    
    <div class="notif-panel" id="notifPanel">
        <div class="notif-header">
            <h3>الإشعارات</h3>
            <button class="mark-read-btn" onclick="markAllRead()">تحديد كـ مقروء</button>
        </div>
        <div class="notif-list"></div>
    </div>

    <main class="plans-container">
        
        <!-- قسم رأس الصفحة (Hero Title) -->
        <section class="plans-hero-section" id="plansHero">
            <h1 class="hero-title">دليل <span>التخصصات</span> والخطط</h1>
            <p class="hero-desc">خطط التخصصات والمواد الدراسية صارت تنعرض بشكل أوضح في منصة مدخل الطلابية 🫡</p>
        </section>

        <!-- التحكم المزدوج (Segmented Pills Control) -->
        <section class="plans-controls-wrapper" id="plansControls">
            <!-- المستوى الأول: الكلية أم المعهد -->
            <div class="segmented-pill-container">
                <button class="segmented-btn active" onclick="switchPlanSource('college')">
                    <i class="fi fi-sr-building"></i> كلية الجبيل
                </button>
                <button class="segmented-btn" onclick="switchPlanSource('institute')">
                    <i class="fi fi-sr-wrench"></i> المعهد التقني
                </button>
            </div>

            <!-- المستوى الثاني: درجة التخصص (تحضيري، بكالوريوس، دبلوم) -->
            <div class="sub-chips-scroll" id="sub-filters-container"></div>
        </section>

        <!-- شبكة عرض التخصصات (Bento Major Grid) -->
        <section id="majors-grid" class="majors-bento-grid">
            <div class="loading-state">
                <i class="fi fi-rr-spinner-alt spin-icon"></i>
                <p>جاري تحميل البيانات ...</p>
            </div>
        </section>

        <!-- شاشة عرض تفاصيل الخطة والمواد (Sleek Plan Inspector) -->
        <section id="plan-detail-view" class="plan-detail-view" style="display: none;">
            <div class="detail-top-nav">
                <button class="back-pill-btn" onclick="closePlanView()">
                    <i class="fi fi-rr-arrow-right"></i> رجوع للتخصصات
                </button>
            </div>

            <!-- كرت ملخص التخصص (Hero Summary Card) -->
            <div class="plan-hero-card">
                <div class="hero-card-header">
                    <span id="majorDegreeBadge" class="degree-tag">بكالوريوس</span>
                    <h2 id="portal-greating" class="major-headline">اسم التخصص</h2>
                </div>
                
                <div class="hero-card-stats">
                    <div class="stat-pill">
                        <i class="fi fi-sr-clock"></i>
                        <div>
                            <span class="stat-label">المدة</span>
                            <span id="majorYears" class="stat-val">4 سنوات</span>
                        </div>
                    </div>
                    <div class="stat-pill">
                        <i class="fi fi-sr-users"></i>
                        <div>
                            <span class="stat-label">المسار</span>
                            <span id="majorGender" class="stat-val">طلاب وطالبت</span>
                        </div>
                    </div>
                    <div class="stat-pill highlight">
                        <i class="fi fi-sr-book-alt"></i>
                        <div>
                            <span class="stat-label">الساعات</span>
                            <span id="total-hours-val" class="stat-val">-- ساعة</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تفاصيل الفصول والمواد الدراسية (Course Accordion) -->
            <div class="semesters-accordion-container" id="courseTableContainer"></div>
        </section>

    </main>

    <!-- البار السفلي العصري -->
    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item"> <i class="fi fi-rr-home"></i> <span>الرئيسية</span> </a>
        <a href="../Tools/Tools.html" class="nav-item"> <i class="fi fi-rr-apps"></i> <span>الأدوات</span> </a>
        <a href="plans.html" class="nav-item active"> <i class="fi fi-sr-dashboard"></i> <span>التخصصات</span> </a>
        <a href="../Library/library.html" class="nav-item"> <i class="fi fi-rr-book-alt"></i> <span>الموسوعة</span> </a>
        <a href="../Pages/news.html" class="nav-item"> <i class="fi fi-rr-newspaper"></i> <span>الأخبار</span> </a>
    </nav>

    <script src="../script.js"></script>
    <script src="../notifications.js"></script>

   <script>
    window.JIC_Bachelor_List = [];
    window.JIC_Diploma_List = [];
    window.JTI_Diploma_List = [];
    let currentLoadingTarget = null;

    function initMajors(config, majorsList) {
        if (currentLoadingTarget === 'JIC_BACH') window.JIC_Bachelor_List = majorsList;
        else if (currentLoadingTarget === 'JIC_DIP') window.JIC_Diploma_List = majorsList;
        else if (currentLoadingTarget === 'JTI') window.JTI_Diploma_List = majorsList;
    }

    async function loadScriptSmart(url, targetList) {
        try {
            currentLoadingTarget = targetList;
            const response = await fetch(url);
            if (!response.ok) throw new Error("File not found");
            let code = await response.text();
            const scriptEl = document.createElement('script');
            scriptEl.textContent = code;
            document.body.appendChild(scriptEl);
        } catch (error) {
            console.error(`❌ فشل تحميل ${url}:`, error);
        }
    }

    async function initAllMajors() {
        // 1. تحميل كافة ملفات البيانات أولاً والانتظار حتى تنتهي
        await loadScriptSmart('../../Majors/bMajors-data.js', 'JIC_BACH');
        await loadScriptSmart('../../Majors/diplomas-data.js', 'JIC_DIP');
        await loadScriptSmart('../../Majors/JTI-data.js', 'JTI');

        // 2. تحميل ملف plans.js بعد اكتمال البيانات
        const engineScript = document.createElement('script');
        engineScript.src = "plans.js";
        
        // 3. عند اكتمال تحميل plans.js، نفذ العرض التلقائي فوراً
        engineScript.onload = () => {
            if (typeof switchPlanSource === 'function') {
                switchPlanSource('college');
            }
        };
        
        document.body.appendChild(engineScript);
    }

    initAllMajors();
</script>
</body>
</html>
