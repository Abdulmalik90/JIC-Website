<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>404 - الصفحة غير موجودة | مدخل</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6; /* أزرق مضيء للدارك مود */
      --primary-dark: #1748a3; /* لون الهوية */
      --bg-dark: #0f172a; /* كحلي غامق جداً */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Tajawal", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      /* خلفية شبكية أنيقة */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      touch-action: none;
    }

    /* تأثير إضاءة خلفية */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
    }

    /* === المحتوى الرئيسي === */
    .main-content {
      transition: all 0.5s ease;
      padding: 20px;
      z-index: 10;
    }

    h1 {
      font-size: 10rem;
      margin: 0;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #fff 20%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
      letter-spacing: -5px;
    }

    .subtitle {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: -10px;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* === الأزرار === */
    .actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      font-family: "Tajawal";
      font-weight: bold;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }

    /* زر العودة (Primary) */
    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }
    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
    }

    /* زر اللعبة (Glass Style) */
    .btn-game {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
    }
    .btn-game:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-3px);
    }
    .btn-game::before {
      content: '👾';
      margin-left: 8px;
    }

    /* === واجهة اللعبة (Overlay) === */
    #game-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(15px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* رأس اللعبة */
    .game-header {
      display: flex;
      justify-content: space-between;
      width: 360px;
      max-width: 90%;
      margin-bottom: 15px;
      align-items: center;
      color: var(--text-main);
      font-size: 1rem;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      gap: 10px;
    }
    .stat-box b { color: var(--primary); }

    .close-game {
      background: rgba(255,255,255,0.1);
      border: none;
      width: 40px; height: 40px;
      border-radius: 50%;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .close-game:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg); }

    /* الكانفس */
    canvas {
      background: #f1f5f9; /* فاتح عشان التباين مع الشعار */
      border-radius: 16px;
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.2);
      border: 4px solid #1e293b;
      image-rendering: pixelated;
    }

    /* أزرار التحكم بالموبايل */
    .mobile-controls {
      display: none;
      gap: 20px;
      margin-top: 25px;
      width: 360px;
      max-width: 90%;
      direction: ltr;
    }

    .control-btn {
      flex: 1;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 1.5rem;
      cursor: pointer;
      transition: 0.1s;
    }
    .control-btn:active { background: var(--primary); transform: scale(0.95); }

    /* === شاشة الخسارة (Modal) === */
    #gameOverModal {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #1e293b;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 320px;
      max-width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 200;
    }

    #gameOverModal h2 { color: #f87171; margin: 0 0 10px 0; font-size: 2rem; }
    #gameOverModal .final-score { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 10px; }
    #gameOverModal .high-score-alert { 
      color: #fbbf24; font-weight: bold; margin-bottom: 25px; 
      padding: 5px 10px; background: rgba(251, 191, 36, 0.1); 
      border-radius: 8px; display: inline-block;
    }
    
    .modal-btns { display: flex; flex-direction: column; gap: 12px; }
    .modal-btns button { width: 100%; border:none; padding: 15px; border-radius: 12px; font-weight:bold; cursor: pointer; font-family:"Tajawal"; }
    .btn-retry { background: var(--text-main); color: var(--bg-dark); }
    .btn-home { background: transparent; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.2) !important; }

    /* تحسينات للجوال */
    @media (max-width: 768px) {
      h1 { font-size: 6rem; }
      .subtitle { font-size: 1.5rem; }
      .mobile-controls { display: flex; }
      #gameOverModal { padding: 25px; }
    }

  </style>
</head>
<body>

  <div class="main-content" id="mainContent">
    <h1 style="margin-bottom: 20px;">404</h1>
    <div class="subtitle">الظاهر الصفحة محذوفة او انتقلت لرابط ثاني !</div>
    <p>تقدر ترجع للصفحة الرئيسية او تجرب لعبتنا المخفيه 🤭</p>
    
    <div class="actions">
      <a href="https://juportal.online" class="btn btn-primary">العودة للرئيسية</a>
      <button onclick="initGame()" class="btn btn-game">العب لعبة مدخل</button>
    </div>
  </div>

  <div id="game-overlay">
    <div class="game-header">
      <div class="stat-box">
          <span>🎯 <b id="scoreVal">0</b></span>
          <span style="border-right:1px solid rgba(255,255,255,0.2); padding-right:10px"></span>
          <span>⚡ <b id="levelVal">1</b></span>
      </div>
      <div class="stat-box" style="border-color: rgba(251, 191, 36, 0.3)">
          <span>🏆 <b id="highScoreVal" style="color:#fbbf24">0</b></span>
      </div>
      <button onclick="quitGame()" class="close-game">✕</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="gameOverModal">
      <h2 style="font-size: 20px;">👾افا الفيروس طرحك !</h2>
      <p class="final-score">جمّعت <span id="finalScore" style="color:white; font-weight:bold">0</span> زائر</p>
      <div class="high-score-alert" id="newRecordMsg" style="display:none">🎉 رقم قياسي جديد!</div>
      
      <div class="modal-btns">
        <button onclick="restartGame()" class="btn-retry">🔄 حاول مرة ثانية</button>
        <button onclick="window.location.href='https://juportal.online'" class="btn-home">🏠 العودة للمنصة</button>
      </div>
    </div>

    <div class="mobile-controls">
      <button class="control-btn" id="leftBtn">◀</button>
      <button class="control-btn" id="rightBtn">▶</button>
    </div>
    <p style="font-size: 0.9rem; margin-top:20px; color:#64748b">سـاعد مدخل في تجميع الزوار والاخبار 👨🏻‍💻 وانتبه من الفيروسات ☠️</p>
  </div>

  <script>
    /* === إعدادات الكانفس === */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("game-overlay");
    const mainContent = document.getElementById("mainContent");
    const gameOverModal = document.getElementById("gameOverModal");
    const newRecordMsg = document.getElementById("newRecordMsg");
    
    const scoreEl = document.getElementById("scoreVal");
    const levelEl = document.getElementById("levelVal");
    const highScoreEl = document.getElementById("highScoreVal");
    const finalScoreEl = document.getElementById("finalScore");

    let highScore = localStorage.getItem('madkhal_highscore') || 0;
    highScoreEl.innerText = highScore;

    const playerImg = new Image();
    playerImg.src = 'favicon-96x96.png'; 

    let width, height;
    let gameLoop;
    let isRunning = false;
    let score = 0;
    let level = 1;
    let frame = 0;
    
    const goodItems = ['📰', '🤓', '👧🏻', '👩🏻', '👷🏻‍♂️', '🙍🏻‍♂️', '👩🏻‍💻'];
    const badItems = ['👾', '☠️'];

    let player = {
      x: 0, y: 0, size: 50, speed: 8, dx: 0
    };

    let items = [];

    /* === تهيئة اللعبة === */
    function resizeCanvas() {
        if (window.innerWidth < 450) {
            width = window.innerWidth - 30;
            height = window.innerHeight * 0.60; // ارتفاع مناسب للجوال
        } else {
            width = 380;
            height = 550;
        }
        canvas.width = width;
        canvas.height = height;
        
        player.y = height - player.size - 10;
        if(player.x === 0 || player.x > width) player.x = width / 2 - player.size / 2;
    }

    function initGame() {
        resizeCanvas();
        mainContent.style.opacity = "0";
        mainContent.style.transform = "scale(0.9)";
        setTimeout(() => {
            mainContent.style.display = "none";
            overlay.style.display = "flex";
            gameOverModal.style.display = "none";
            resetState();
            isRunning = true;
            loop();
        }, 300);
    }

    function quitGame() {
        isRunning = false;
        overlay.style.display = "none";
        mainContent.style.display = "block";
        setTimeout(() => {
          mainContent.style.opacity = "1";
          mainContent.style.transform = "scale(1)";
        }, 50);
    }

    function restartGame() {
        gameOverModal.style.display = "none";
        resetState();
        isRunning = true;
        loop();
    }

    function resetState() {
        score = 0;
        level = 1;
        scoreEl.innerText = 0;
        levelEl.innerText = 1;
        items = [];
        player.x = width / 2 - player.size / 2;
        frame = 0;
        newRecordMsg.style.display = "none";
    }

    /* === منطق اللعب === */
    function spawnItem() {
        const isGood = Math.random() > 0.3; 
        const emojiList = isGood ? goodItems : badItems;
        const emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
        const size = 32;
        const x = Math.random() * (width - size);
        const baseSpeed = 3 + (level * 0.6); 
        
        items.push({
            x: x, y: -40,
            emoji: emoji,
            type: isGood ? 'good' : 'bad',
            speed: baseSpeed,
            size: size
        });
    }

    function update() {
        if (rightPressed && player.x + player.size < width) player.x += player.speed;
        if (leftPressed && player.x > 0) player.x -= player.speed;

        let spawnRate = Math.max(20, 60 - (level * 3));
        if (frame % spawnRate === 0) spawnItem();

        for (let i = 0; i < items.length; i++) {
            let item = items[i];
            item.y += item.speed;

            // كشف التصادم
            if (
                item.x < player.x + player.size &&
                item.x + item.size > player.x &&
                item.y < player.y + player.size &&
                item.y + item.size > player.y
            ) {
                if (item.type === 'good') {
                    score++;
                    scoreEl.innerText = score;
                    if (score > 0 && score % 50 === 0) {
                        level++;
                        levelEl.innerText = level;
                    }
                    items.splice(i, 1);
                    i--;
                    continue;
                } else {
                    gameOver();
                    return;
                }
            }

            if (item.y > height) {
                items.splice(i, 1);
                i--;
            }
        }
        frame++;
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        if (playerImg.complete && playerImg.naturalHeight !== 0) {
            ctx.drawImage(playerImg, player.x, player.y, player.size, player.size);
        } else {
            ctx.fillStyle = "#1748a3";
            ctx.fillRect(player.x, player.y, player.size, player.size);
        }

        ctx.font = "30px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        
        for (let item of items) {
            ctx.fillText(item.emoji, item.x, item.y);
        }
    }

    function loop() {
        if (!isRunning) return;
        update();
        draw();
        gameLoop = requestAnimationFrame(loop);
    }

    function gameOver() {
        isRunning = false;
        finalScoreEl.innerText = score;
        
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('madkhal_highscore', highScore);
            highScoreEl.innerText = highScore;
            newRecordMsg.style.display = "inline-block";
        } else {
            newRecordMsg.style.display = "none";
        }

        gameOverModal.style.display = "block";
    }

    /* === التحكم === */
    let leftPressed = false;
    let rightPressed = false;

    function handleInput(btn, dir) {
        const start = (e) => { 
            if(e.cancelable) e.preventDefault(); 
            if(dir === 'l') leftPressed = true; else rightPressed = true; 
        };
        const end = (e) => { 
            if(e.cancelable) e.preventDefault(); 
            if(dir === 'l') leftPressed = false; else rightPressed = false; 
        };

        btn.addEventListener("touchstart", start, {passive: false});
        btn.addEventListener("touchend", end);
        btn.addEventListener("mousedown", start);
        btn.addEventListener("mouseup", end);
        btn.addEventListener("mouseleave", end);
    }

    const lBtn = document.getElementById("leftBtn");
    const rBtn = document.getElementById("rightBtn");

    handleInput(lBtn, 'l');
    handleInput(rBtn, 'r');

    document.addEventListener("keydown", (e) => {
        if(e.key === "ArrowLeft") leftPressed = true;
        if(e.key === "ArrowRight") rightPressed = true;
    });

    document.addEventListener("keyup", (e) => {
        if(e.key === "ArrowLeft") leftPressed = false;
        if(e.key === "ArrowRight") rightPressed = false;
    });

    window.addEventListener('resize', () => {
        if(isRunning) resizeCanvas();
    });

  </script>
</body>
</html>
