<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>404 - الصفحة غير موجودة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: "Tajawal", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #f5f7fb;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(0, 0, 0, 0.02) 0,
        rgba(0, 0, 0, 0.02) 1px,
        transparent 1px,
        transparent 20px
      );
      color: #1c1c1c;
      overflow: hidden;
      touch-action: none;
    }

    /* المحتوى الأساسي */
    .main-content {
      transition: opacity 0.3s;
      padding: 20px;
    }

    h1 {
      font-size: 8rem;
      margin: 0;
      color:#1748a3;
      font-weight: 800;
      line-height: 1;
    }

    p {
      font-size: 1.4rem;
      margin-top: 10px;
      color: #333;
      margin-bottom: 30px;
    }

    /* الأزرار */
    .actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1.1rem;
      text-decoration: none;
      transition: 0.3s;
      cursor: pointer;
      border: none;
      font-family: "Tajawal";
      font-weight: bold;
      outline: none;
    }

    .btn-primary {
      background-color:#1748a3;
      color: white;
    }
    .btn-primary:hover { background-color: #1a5cd6; }

    .btn-secondary {
      background-color: transparent;
      border: 2px solid #1748a3;
      color: #1748a3;
    }
    .btn-secondary:hover { background-color: #eef4ff; }

    /* واجهة اللعبة */
    #game-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(245, 247, 251, 0.98);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    canvas {
      background: #fff;
      border: 3px solid #1748a3;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(23, 72, 163, 0.2);
      max-width: 95%;
      max-height: 70vh; 
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      width: 320px;
      max-width: 90%;
      margin-bottom: 10px;
      align-items: center;
      font-weight: bold;
      color: #1748a3;
    }
    
    .stats-container {
        display: flex;
        gap: 15px;
        font-size: 1.1rem;
    }

    .close-game {
      background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #777; font-family: "Tajawal";
    }

    /* رسالة التحدي العائمة */
    .milestone-msg {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(23, 72, 163, 0.95);
      color: white;
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.2rem;
      opacity: 0;
      transition: opacity 0.5s, transform 0.5s;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    .milestone-msg.show {
      opacity: 1;
      transform: translate(-50%, -60%);
    }

    /* أزرار التحكم للجوال */
    .mobile-controls {
      display: none;
      gap: 20px;
      margin-top: 20px;
      width: 320px;
      max-width: 90%;
      direction: ltr; 
    }

    .control-btn {
      flex: 1;
      padding: 15px;
      background: #1748a3;
      color: white;
      border-radius: 12px;
      border: none;
      font-size: 1.5rem;
      box-shadow: 0 4px 0 #0f306e;
      transition: 0.1s;
      cursor: pointer;
    }
    .control-btn:active { transform: translateY(4px); box-shadow: none; }

    @media (max-width: 1024px) {
      h1 { font-size: 5rem; }
      .mobile-controls { display: flex; }
      canvas { width: 90%; }
    }
  </style>
</head>
<body>
  <div class="main-content" id="mainContent">
    <h1>404</h1>
    <p>معليش الظاهر صارت مشكلة او ان الصفحة محذوفة !<br>جرب لعبة مدخل المخفية وورينا كم نقطة تقدر تجيب 🏆</p>
    
    <div class="actions">
      <a href="../index.html" class="btn btn-primary">العودة إلى الرئيسية</a>
      <button onclick="startGame()" class="btn btn-secondary">🎮 العب لعبة</button>
    </div>
  </div>

  <div id="game-overlay">
    <div class="game-header">
      <div class="stats-container">
          <span>الزوار: <span id="scoreVal">0</span></span>
          <span style="color:#e67e22">🏆 الأعلـى: <span id="highScoreVal">0</span></span>
      </div>
      <button onclick="stopGame()" class="close-game">✕ خروج</button>
    </div>
    
    <div id="milestoneMsg" class="milestone-msg">كفو عليك! تعديت الـ 50.. استمر يابطل 🔥</div>

    <canvas id="gameCanvas"></canvas>
    
    <div class="mobile-controls">
      <button class="control-btn" id="leftBtn">◀</button>
      <button class="control-btn" id="rightBtn">▶</button>
    </div>
    <p style="font-size: 0.9rem; margin-top:15px; color:#555">ساعد "مدخل" لتجميع الزوار وتفادي الفيروسات 🫡</p>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("game-overlay");
    const mainContent = document.getElementById("mainContent");
    const scoreEl = document.getElementById("scoreVal");
    const highScoreEl = document.getElementById("highScoreVal");
    const milestoneEl = document.getElementById("milestoneMsg");

    const playerImg = new Image();
    playerImg.src = './favicon-96x96.png'; // تأكد إن الصورة موجودة

    let highScore = localStorage.getItem('madkhal_highscore') || 0;
    highScoreEl.innerText = highScore;

    let width = 320;
    let height = 450;
    
    function resizeCanvas() {
        if (window.innerWidth < 400) {
            width = window.innerWidth - 30;
        } else {
            width = 350;
        }
        canvas.width = width;
        canvas.height = height;
    }
    resizeCanvas();

    let gameLoop;
    let isRunning = false;
    let score = 0;
    let frame = 0;
    let gameSpeed = 3;
    let particles = []; 
    
    // متغير عشان نعرف إذا وصل 50
    let passedMilestone = false;

    let madkhal = {
      x: width / 2 - 25,
      y: height - 60,
      w: 50,
      h: 50,
      speed: 7
    };

    let drops = [];
    let leftPressed = false;
    let rightPressed = false;

    function startGame() {
      mainContent.style.opacity = "0";
      resizeCanvas();
      setTimeout(() => {
        mainContent.style.display = "none";
        overlay.style.display = "flex";
        resetGame();
        isRunning = true;
        loop();
      }, 300);
    }

    function stopGame() {
      isRunning = false;
      cancelAnimationFrame(gameLoop);
      overlay.style.display = "none";
      mainContent.style.display = "flex";
      setTimeout(() => { mainContent.style.opacity = "1"; }, 50);
      milestoneEl.classList.remove("show"); // إخفاء الرسالة لو كانت طالعة
    }

    function resetGame() {
      score = 0;
      scoreEl.innerText = "0";
      drops = [];
      particles = [];
      madkhal.x = width / 2 - 25;
      frame = 0;
      gameSpeed = 3;
      passedMilestone = false;
      milestoneEl.classList.remove("show");
    }

    function saveHighScore() {
        if(score > highScore) {
            highScore = score;
            localStorage.setItem('madkhal_highscore', highScore);
            highScoreEl.innerText = highScore;
        }
    }

    function spawnDrop() {
      if(!isRunning) return;
      let type = Math.random() > 0.3 ? 'good' : 'bad';
      let size = 18;
      let dropX = Math.random() * (width - size);
      
      // زيادة الصعوبة كل ما زاد السكور
      let speedVar = (score > 50) ? 3 : 2; 

      drops.push({
        x: dropX,
        y: -20,
        size: size,
        type: type,
        speed: Math.random() * speedVar + gameSpeed
      });
    }

    function createParticles() {
        for(let i=0; i<60; i++) {
            particles.push({
                x: width/2,
                y: height/2, // تنفجر من النص
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                life: 60, // تعيش فترة أقصر عشان ما تغطي اللعب
                color: `hsl(${Math.random()*360}, 70%, 50%)`
            });
        }
    }

    function updateParticles() {
        for(let i=0; i<particles.length; i++) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            p.vy += 0.5; // جاذبية بسيطة
            if(p.life <= 0) {
                particles.splice(i, 1);
                i--;
            }
        }
    }

    function triggerMilestone() {
        passedMilestone = true;
        // إظهار الرسالة
        milestoneEl.classList.add("show");
        // إطلاق الاحتفال
        createParticles();
        
        // إخفاء الرسالة بعد 3 ثواني
        setTimeout(() => {
            milestoneEl.classList.remove("show");
        }, 3000);
    }

    function update() {
      
      // منطق الوصول لـ 50
      if (score >= 50 && !passedMilestone) {
          triggerMilestone();
      }

      if (leftPressed && madkhal.x > 0) madkhal.x -= madkhal.speed;
      if (rightPressed && madkhal.x + madkhal.w < width) madkhal.x += madkhal.speed;

      // تسريع وتيرة نزول العناصر مع الوقت
      let spawnRate = (score > 60) ? 30 : 40;
      if (frame % spawnRate === 0) spawnDrop();

      for (let i = 0; i < drops.length; i++) {
        let d = drops[i];
        d.y += d.speed;

        // التحقق من التصادم
        if (
          d.y + d.size >= madkhal.y && 
          d.y <= madkhal.y + madkhal.h &&
          d.x + d.size >= madkhal.x && 
          d.x <= madkhal.x + madkhal.w
        ) {
          if (d.type === 'good') {
            score++;
            scoreEl.innerText = score;
            if(score % 10 === 0) gameSpeed += 0.5;
            drops.splice(i, 1);
            i--;
            continue;
          } else {
            gameOver();
            return;
          }
        }

        if (d.y > height) {
          drops.splice(i, 1);
          i--;
        }
      }
      frame++;
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // رسم الشعار
      if (playerImg.complete && playerImg.naturalHeight !== 0) {
        ctx.drawImage(playerImg, madkhal.x, madkhal.y, madkhal.w, madkhal.h);
      } else {
        ctx.fillStyle = "#1748a3";
        ctx.fillRect(madkhal.x, madkhal.y, madkhal.w, madkhal.h);
      }

      // رسم العناصر
      for (let d of drops) {
        if (d.type === 'good') {
          ctx.beginPath();
          ctx.arc(d.x + d.size/2, d.y + d.size/2, d.size/2, 0, Math.PI * 2);
          ctx.fillStyle = "#1748a3";
          ctx.fill();
        } else {
          ctx.fillStyle = "#e74c3c";
          ctx.fillRect(d.x, d.y, d.size, d.size);
          ctx.strokeStyle = "white";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.size, d.y + d.size);
          ctx.moveTo(d.x + d.size, d.y);
          ctx.lineTo(d.x, d.y + d.size);
          ctx.stroke();
        }
      }

      // رسم الاحتفال فوق كل شيء
      for(let p of particles) {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 5, 5);
      }
    }

    function loop() {
      if (!isRunning && particles.length === 0) return; 
      update();
      if(particles.length > 0) updateParticles();
      draw();
      gameLoop = requestAnimationFrame(loop);
    }

    function gameOver() {
      saveHighScore();
      isRunning = false;
      ctx.fillStyle = "rgba(231, 76, 60, 0.95)";
      ctx.fillRect(20, height/2 - 60, width - 40, 120);
      
      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px Tajawal";
      ctx.textAlign = "center";
      ctx.fillText("دخل فيروس للمنصة! 👾", width/2, height/2 - 15);
      
      ctx.font = "18px Tajawal";
      ctx.fillText("جبت: " + score, width/2, height/2 + 20);
      
      ctx.font = "14px Tajawal";
      if(score >= highScore && score > 0) {
          ctx.fillText("🎉 رقم قياسي جديد!", width/2, height/2 + 45);
      } else {
          ctx.fillText("أعلى رقم: " + highScore, width/2, height/2 + 45);
      }

      canvas.onclick = () => {
        canvas.onclick = null;
        resetGame();
        isRunning = true;
        loop();
      };
    }

    const setDir = (dir, val) => {
        if(dir === 'left') leftPressed = val;
        if(dir === 'right') rightPressed = val;
    };

    const lBtn = document.getElementById("leftBtn");
    const rBtn = document.getElementById("rightBtn");

    const handleInput = (btn, dir) => {
        btn.addEventListener("touchstart", (e) => { e.preventDefault(); setDir(dir, true); });
        btn.addEventListener("touchend", (e) => { e.preventDefault(); setDir(dir, false); });
        btn.addEventListener("mousedown", () => setDir(dir, true));
        btn.addEventListener("mouseup", () => setDir(dir, false));
    };

    handleInput(lBtn, 'left');
    handleInput(rBtn, 'right');

    document.addEventListener("keydown", e => {
      if(e.key === "ArrowLeft") leftPressed = true;
      if(e.key === "ArrowRight") rightPressed = true;
    });
    document.addEventListener("keyup", e => {
      if(e.key === "ArrowLeft") leftPressed = false;
      if(e.key === "ArrowRight") rightPressed = false;
    });

    window.addEventListener('resize', resizeCanvas);

  </script>
</body>

</html>
